# Chạy trên VPS:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Migration trước khi up:  docker compose -f docker-compose.prod.yml run --rm api ./node_modules/.bin/prisma migrate deploy --schema=prisma/schema.prisma
services:
  api:
    image: ${API_IMAGE:-tram-api:latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    expose:
      - "3000"

  # worker:   # bật ở giai đoạn 6 (tự tạo preview bằng ffmpeg)
  #   image: ${WORKER_IMAGE:-tram-worker:latest}
  #   restart: unless-stopped
  #   env_file: .env.production
  #   depends_on: [redis]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api

volumes:
  redisdata:
  caddydata:
  caddyconfig:
